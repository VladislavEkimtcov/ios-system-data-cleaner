# Tooling config only. The runtime engine has NO third-party dependencies (standard
# library: plistlib, sqlite3, subprocess, http.server, …). This file configures the test
# runner and linter; it does not declare or require any runtime packages.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["mvt_reports", "tools", "simulator_apps"]

[tool.ruff.lint]
# Keep the net conservative: real errors and obvious bugs, not stylistic churn.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length is enforced loosely; long report strings are fine
    "E741",  # ambiguous variable names (l) appear in small local loops
]

[tool.ruff.lint.isort]
known-first-party = ["common"]
