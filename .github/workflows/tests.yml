name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pii-check:
    name: PII / secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Scan tracked source for leaked identifiers
        run: python3 check_pii.py

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: pii-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: revive.bat finds Python (Windows only)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          REVIVE_PROBE_ONLY: "1"
        run: call revive.bat
